name: Build iOS (.ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - "project/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    env:
      YYP: ${{ github.workspace }}/project/PigsRevenge2/PigsRevenge2.yyp
    steps:
      - uses: actions/checkout@v4

      # Licence: either the GameMaker access key (secret ACCESS_KEY), or the
      # licence.plist from a signed-in GameMaker IDE (secret LICENCE_PLIST).
      # igor-setup reuses a valid licence.plist it finds in its user folder.
      - name: Prepare GameMaker licence
        env:
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          LICENCE_PLIST: ${{ secrets.LICENCE_PLIST }}
        run: |
          if [ -n "$LICENCE_PLIST" ]; then
            # igor-setup resolves its sandbox relative to its own dist folder
            # (seen in logs), and older versions relative to the workspace.
            for dir in "$(dirname "$RUNNER_WORKSPACE")/_actions/bscotch/igor-setup/v3/dist/gm-sandbox/gm-user/tempUser" \
                       "$GITHUB_WORKSPACE/gm-sandbox/gm-user/tempUser"; do
              mkdir -p "$dir"
              printf '%s' "$LICENCE_PLIST" > "$dir/licence.plist"
              echo "licence.plist -> $dir"
            done
            grep -q "<plist" "$dir/licence.plist" || { echo "::error::LICENCE_PLIST does not look like a licence.plist file"; exit 1; }
            grep -A1 -iE "expiry_?date" "$dir/licence.plist" | tail -1 | sed "s/<[^>]*>//g;s/^[[:space:]]*/Licence expires: /"
          elif [ -z "$ACCESS_KEY" ]; then
            echo "::error::Add a repository secret: ACCESS_KEY (GameMaker access key) or LICENCE_PLIST (contents of licence.plist)"
            exit 1
          fi

      - name: Set up Igor (GameMaker command line)
        id: igor
        uses: bscotch/igor-setup@v3
        with:
          access-key: ${{ secrets.ACCESS_KEY || 'unused-licence-file-provided' }}
          target-yyp: ${{ env.YYP }}
          modules: ios
          cache: true

      - name: Build Xcode project with Igor
        id: build
        uses: bscotch/igor-build@v1
        with:
          yyp-path: ${{ env.YYP }}
          user-dir: ${{ steps.igor.outputs.user-dir }}
          platform: ios
          save-logs: true

      - name: Upload Igor log
        if: always() && steps.build.outputs.log-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: igor-log
          path: ${{ steps.build.outputs.log-dir }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Build unsigned .ipa with xcodebuild
        id: ipa
        working-directory: ${{ steps.build.outputs.out-dir }}
        run: |
          set -euo pipefail
          ls -la
          if [ -f Podfile ] && [ ! -d Pods ]; then pod install; fi
          if ls *.xcworkspace >/dev/null 2>&1; then
            CONTAINER=(-workspace "$(ls -d *.xcworkspace | head -1)")
          else
            CONTAINER=(-project "${{ steps.build.outputs.out-name }}")
          fi
          xcodebuild "${CONTAINER[@]}" -list
          SCHEME=$(xcodebuild "${CONTAINER[@]}" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); d=d.get('workspace') or d.get('project'); print(d['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild "${CONTAINER[@]}" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          test "${PIPESTATUS[0]}" -eq 0 || { tail -100 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/PigsRevenge2.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/PigsRevenge2.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PigsRevenge2-ipa
          path: PigsRevenge2.ipa
          retention-days: 30

      - name: Publish to the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest PigsRevenge2.ipa \
            --title "Pigs Revenge 2 (iOS, unsigned)" \
            --notes "Unsigned build from ${GITHUB_SHA}. Install with Sideloadly using your Apple ID." \
            --prerelease
